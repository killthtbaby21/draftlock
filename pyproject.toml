[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draftlock"
version = "0.1.0"
description = "Rewrite your own draft paragraph by paragraph with Claude, with facts locked and every change shown in a diff report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=2.6", "python-docx>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
draftlock = "draftlock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
draftlock = ["prompts/*.md"]
